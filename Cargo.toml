[package]
name = "ttop"
version = "0.0.1"
edition = "2024"
authors = ["Nathanael G. Reese <reesenate@gmail.com>"]
description = "TUI-Based System Monitoring Utility."
readme = "README.md"
repository = "https://github.com/netanelreese/ttop"
license = "GPL-3"
license-file = "LICENSE"
keywords = ["top", "tui", "system-utility"]
categories = ["command-line-interface", "command-line-utilities", "os::linux-apis"]
publish = true

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 0
overflow-checks = true
debug = true
lto = false
panic = "unwind"

[profile.release]
opt-level = 3
strip = true
lto = "fat"
panic = "abort"

[dependencies]
clap = "4.5.37"
ratatui = "0.29.0"
